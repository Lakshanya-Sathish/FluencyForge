<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Speaking | FluencyForge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #f5f7ff;
      height: 100vh;
      overflow: hidden;
    }

    .main {
      display: flex;
      height: 100vh;
    }

    #leftPane {
      flex: 1;
      background: #ffffff;
      padding: 20px;
      overflow-y: auto;
      border-right: 2px solid #e2e2e2;
    }

    #taskHeader {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .readingBlock {
      background: #f0f4ff;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid #4a90e2;
    }

    .listeningBlock {
      background: #fff4d9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid #f5a623;
    }

    #rightPane {
      width: 40%;
      background: #fafafa;
      padding: 20px;
      overflow-y: auto;
      position: relative;
    }

    .stickyHeader {
      position: sticky;
      top: 0;
      background: #fafafa;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #timer {
      font-weight: bold;
      background: #4a90e2;
      padding: 6px 12px;
      border-radius: 8px;
      color: white;
    }

    #micBtn,
    #submitBtn {
      margin-top: 20px;
      padding: 12px 20px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #4a90e2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #submitBtn {
      background: #28a745;
    }

    #reviewScreen {
      display: none;
      padding: 15px;
    }

    .review-item {
      background: white;
      border: 1px solid #ccc;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }

    #aiFeedbackBox {
      display: none;
      background: white;
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="main">

    <!-- LEFT -->
    <div id="leftPane">
      <h2 id="taskHeader">Loading...</h2>

      <div id="readingContainer"></div>
      <div id="listeningContainer"></div>

      <div id="taskPrompt" style="margin-top:20px; font-size:18px;"></div>
    </div>

    <!-- RIGHT -->
    <div id="rightPane">

      <div class="stickyHeader">
        <div id="taskProgress">Task 1 of 4</div>
        <div id="timer">01:00</div>
      </div>

      <button id="micBtn">🎤 Start Recording</button>
      <button id="submitBtn" onclick="submitTask()">Submit Task</button>

      <div id="reviewScreen">
        <h2>Review</h2>
        <div id="reviewList"></div>

        <button onclick="finishModule()" style="
          margin-top:20px;padding:12px;width:100%;
          background:#4a90e2;color:#fff;border:none;border-radius:8px;">
          Finish Module
        </button>
      </div>

      <!-- AI FEEDBACK -->
      <div id="aiFeedbackBox"></div>

    </div>

  </div>

  <script>
    const API_BASE = "http://localhost:3001";
    /* GET MODULE FROM URL */
    let params = new URLSearchParams(window.location.search);
    let moduleId = params.get("id");

    if (!moduleId) {
      alert("Invalid module");
      window.location.href = "speaking-modules.html";
    }

    let level =
      moduleId.includes("-B") ? "beginner" :
        moduleId.includes("-I") ? "intermediate" :
          "advanced";

    let tasks = [];
    let current = 0;

    let recording = false;
    let recorder;
    let audioChunks = [];

    let timerInterval;

    /* LOAD SPEAKING MODULE */
    async function loadSpeaking() {
      try {
        const res = await fetch(`content/speaking/${level}.json`);
        const data = await res.json();

        const mod = data.modules.find(m => m.id === moduleId);
        if (!mod) throw new Error("Module not found");

        tasks = mod.tasks;
        loadTask();
      } catch (err) {
        alert("Error loading module");
      }
    }

    /* LOAD CURRENT TASK */
    function loadTask() {
      const t = tasks[current];

      document.getElementById("taskHeader").innerText =
        `${t.type.toUpperCase()} Task`;
      document.getElementById("taskProgress").innerText =
        `Task ${current + 1} of ${tasks.length}`;

      document.getElementById("readingContainer").innerHTML =
        t.reading
          ? `<div class="readingBlock"><strong>Reading:</strong><br>${t.reading}</div>`
          : "";

      document.getElementById("listeningContainer").innerHTML =
        t.audio
          ? `<div class="listeningBlock"><strong>Listening:</strong><br><audio controls src="${t.audio}"></audio></div>`
          : "";

      document.getElementById("taskPrompt").innerHTML =
        `<strong>Task:</strong> ${t.task}`;

      startTimer(t.expectedDurationSeconds);
    }

    /* TIMER */
    function startTimer(seconds) {
      clearInterval(timerInterval);

      let s = seconds;

      timerInterval = setInterval(() => {
        if (s <= 0) return clearInterval(timerInterval);

        s--;
        let m = Math.floor(s / 60);
        let sec = s % 60;

        document.getElementById("timer").innerText =
          `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
      }, 1000);
    }

    /* RECORDING HANDLER */
    document.getElementById("micBtn").onclick = () => {
      if (!recording) startRecording();
      else stopRecording();
    };

    async function startRecording() {
      try {
        let stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        recording = true;
        audioChunks = [];

        recorder = new MediaRecorder(stream);
        recorder.start();

        recorder.ondataavailable = e => audioChunks.push(e.data);

        document.getElementById("micBtn").innerText = "⏹ Stop Recording";
      } catch (err) {
        alert("Microphone access denied");
      }
    }

    function stopRecording() {
      recording = false;

      recorder.stop();
      recorder.onstop = () => {
        let blob = new Blob(audioChunks, { type: "audio/mp3" });

        tasks[current].userAudio = blob;
        sendForAI(blob);

        document.getElementById("micBtn").innerText = "🎤 Start Recording";
      };
    }

    /* SUBMIT TASK */
    function submitTask() {
      if (current < tasks.length - 1) {
        current++;
        loadTask();
      } else {
        showReview();
      }
    }

    /* REVIEW SCREEN */
    function showReview() {
      document.getElementById("reviewScreen").style.display = "block";
      document.getElementById("micBtn").style.display = "none";
      document.getElementById("submitBtn").style.display = "none";

      let list = document.getElementById("reviewList");
      list.innerHTML = "";

      tasks.forEach((t, i) => {
        list.innerHTML += `
          <div class="review-item">
            <strong>Task ${i + 1}</strong><br>
            ${t.userAudio ? "🎤 Response recorded" : "⚠ No audio submitted"}
          </div>`;
      });
    }

    /* SEND AUDIO TO BACKEND */
    async function sendForAI(blob) {
      const fd = new FormData();
      fd.append("audio", blob);
      fd.append("moduleId", moduleId);

      showAIFeedback("<em>Evaluating... please wait</em>");

      try {
        const res = await fetch(`${API_BASE}/api/evaluate-speaking`, {
          method: "POST",
          body: fd
        });

        const data = await res.json();

        if (data.error) {
          showAIFeedback("Error evaluating response.");
          return;
        }

        showAIFeedback(data.feedback || "No feedback returned.");

        updateAdaptiveLevel(data.score);
      } catch (err) {
        showAIFeedback("Server unreachable.");
      }
    }

    /* DISPLAY FEEDBACK */
    function showAIFeedback(text) {
      const box = document.getElementById("aiFeedbackBox");
      box.style.display = "block";
      box.innerHTML = `<h2>AI Evaluation</h2>${text.replace(/\n/g, "<br>")}`;
    }

    /* ADAPTIVE UNLOCK */
    function updateAdaptiveLevel(score) {
      if (!score) return;

      if (score >= 85) {
        localStorage.setItem("speaking-level-intermediate", "unlocked");
        localStorage.setItem("speaking-level-advanced", "unlocked");
      } else if (score >= 70) {
        localStorage.setItem("speaking-level-intermediate", "unlocked");
      }

      let done = JSON.parse(localStorage.getItem("speakingCompleted") || "{}");
      done[moduleId] = true;
      localStorage.setItem("speakingCompleted", JSON.stringify(done));
    }

    /* FINISH MODULE */
    function finishModule() {
      window.location.href = "speaking-modules.html";
    }

    loadSpeaking();
  </script>

  <script src="theme.js"></script>

</body>

</html>
