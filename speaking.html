<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Speaking | FluencyForge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #f5f7ff;
      height: 100vh;
      overflow: hidden;
    }

    .main {
      display: flex;
      height: 100vh;
    }

    /* LEFT PANE - Task Details */
    #leftPane {
      flex: 1;
      background: #ffffff;
      padding: 20px;
      overflow-y: auto;
      border-right: 2px solid #e2e2e2;
    }

    #taskHeader {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .readingBlock {
      background: #f0f4ff;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid #4a90e2;
    }

    .listeningBlock {
      background: #fff4d9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid #f5a623;
    }

    /* RIGHT PANE - Answer & Controls */
    #rightPane {
      width: 40%;
      background: #fafafa;
      padding: 20px;
      overflow-y: auto;
      position: relative;
    }

    .stickyHeader {
      position: sticky;
      top: 0;
      background: #fafafa;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #timer {
      font-weight: bold;
      background: #4a90e2;
      padding: 6px 12px;
      border-radius: 8px;
      color: white;
    }

    #taskProgress {
      font-weight: 600;
    }

    #micBtn {
      margin-top: 20px;
      padding: 12px 20px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #4a90e2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #submitBtn {
      margin-top: 15px;
      padding: 12px 20px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #28a745;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #reviewScreen {
      display: none;
      padding: 15px;
    }

    .review-item {
      background: white;
      border: 1px solid #ccc;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="main">

    <!-- LEFT: Task Info -->
    <div id="leftPane">
      <h2 id="taskHeader">Loading...</h2>

      <div id="readingContainer"></div>
      <div id="listeningContainer"></div>

      <div id="taskPrompt" style="margin-top:20px; font-size:18px;"></div>
    </div>

    <!-- RIGHT: Timer + Recording + Submit -->
    <div id="rightPane">

      <div class="stickyHeader">
        <div id="taskProgress">Task 1 of 4</div>
        <div id="timer">01:00</div>
      </div>

      <button id="micBtn">🎤 Start Recording</button>
      <button id="submitBtn" onclick="submitTask()">Submit Task</button>

      <div id="reviewScreen">
        <h2>Review</h2>
        <div id="reviewList"></div>

        <button onclick="finishModule()" style="
        margin-top:20px; padding:12px; width:100%;
        background:#4a90e2; color:#fff; border:none; border-radius:8px;">
          Finish Module
        </button>
      </div>

    </div>

  </div>

  <script>
    let params = new URLSearchParams(window.location.search);
    let moduleId = params.get("id");
    let level = moduleId.split("-")[1] === "B" ? "beginner" :
      moduleId.split("-")[1] === "I" ? "intermediate" :
        moduleId.split("-")[1] === "A" ? "advanced" : null;

    let tasks = [];
    let current = 0;
    let recording = false;
    let recorder;
    let audioChunks = [];
    let timerInterval;

    /* ---------------- LOAD JSON ---------------- */
    async function loadSpeaking() {
      const res = await fetch(`content/speaking/${level}.json`);
      const data = await res.json();

      let mod = data.modules.find(m => m.id === moduleId);
      tasks = mod.tasks;

      loadTask();
    }

    function loadTask() {
      const t = tasks[current];

      document.getElementById("taskHeader").innerText = t.type.toUpperCase() + " Task";
      document.getElementById("taskProgress").innerText = `Task ${current + 1} of ${tasks.length}`;

      /* READING */
      if (t.reading) {
        document.getElementById("readingContainer").innerHTML =
          `<div class="readingBlock"><strong>Reading:</strong><br>${t.reading}</div>`;
      } else {
        document.getElementById("readingContainer").innerHTML = "";
      }

      /* LISTENING */
      if (t.audio) {
        document.getElementById("listeningContainer").innerHTML =
          `<div class="listeningBlock">
         <strong>Listening:</strong><br>
         <audio controls src="${t.audio}"></audio>
       </div>`;
      } else {
        document.getElementById("listeningContainer").innerHTML = "";
      }

      /* PROMPT */
      document.getElementById("taskPrompt").innerHTML = `<strong>Task:</strong> ${t.task}`;

      startTimer(t.expectedDurationSeconds);
    }

    /* ---------------- TIMER ---------------- */
    function startTimer(seconds) {
      clearInterval(timerInterval);
      let s = seconds;

      timerInterval = setInterval(() => {
        if (s <= 0) {
          clearInterval(timerInterval);
          return;
        }
        s--;
        let m = Math.floor(s / 60);
        let sec = s % 60;
        document.getElementById("timer").innerText =
          `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
      }, 1000);
    }

    /* ---------------- RECORDING ---------------- */
    document.getElementById("micBtn").onclick = async function () {
      if (!recording) {
        startRecording();
      } else {
        stopRecording();
      }
    };

    async function startRecording() {
      recording = true;
      audioChunks = [];

      let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recorder = new MediaRecorder(stream);

      recorder.start();
      recorder.ondataavailable = e => audioChunks.push(e.data);

      document.getElementById("micBtn").innerText = "⏹ Stop Recording";
    }

    function stopRecording() {
      recording = false;
      recorder.stop();
      recorder.onstop = () => {
        let blob = new Blob(audioChunks, { type: "audio/mp3" });

        // User audio stored in memory for review (not saved permanently)
        tasks[current].userAudio = blob;

        document.getElementById("micBtn").innerText = "🎤 Start Recording";
      };
    }

    /* ---------------- SUBMIT TASK ---------------- */
    function submitTask() {
      if (current < tasks.length - 1) {
        current++;
        loadTask();
      } else {
        showReview();
      }
    }

    /* ---------------- REVIEW SCREEN ---------------- */
    function showReview() {
      document.getElementById("reviewScreen").style.display = "block";
      document.getElementById("micBtn").style.display = "none";
      document.getElementById("submitBtn").style.display = "none";
      document.getElementById("taskProgress").style.display = "none";

      let list = document.getElementById("reviewList");
      list.innerHTML = "";

      tasks.forEach((t, i) => {
        list.innerHTML += `
      <div class="review-item">
        <strong>Task ${i + 1}</strong><br>
        ${t.userAudio ? "🎤 Response recorded" : "⚠ No audio recorded"}
      </div>
    `;
      });
    }

    /* ---------------- FINISH MODULE ---------------- */
    function finishModule() {
      alert("Module completed!");
      window.location.href = "speaking-modules.html";
    }

    loadSpeaking();
  </script>

</body>

</html>
