<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Reading | FluencyForge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #f5f7ff;
      height: 100vh;
      overflow: hidden;
    }

    .main {
      display: flex;
      height: 100vh;
    }

    #passagePane {
      flex: 1;
      background: #ffffff;
      padding: 20px;
      overflow-y: auto;
      border-right: 2px solid #e2e2e2;
    }

    #questionPane {
      width: 45%;
      background: #fafafa;
      padding: 20px;
      overflow-y: auto;
      position: relative;
    }

    .stickyHeader {
      position: sticky;
      top: 0;
      background: #fafafa;
      padding: 12px 0;
      z-index: 100;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #timer {
      font-weight: bold;
      background: #4a90e2;
      padding: 6px 12px;
      border-radius: 8px;
      color: white;
    }

    .question {
      margin: 25px 0;
      padding: 15px;
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .optionLabel {
      display: block;
      margin: 6px 0;
      cursor: pointer;
    }

    .insert-spot {
      background: #e5e5e5;
      padding: 2px 6px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }

    .insert-spot.selected {
      background: #ffe44d;
    }

    .toefl-highlight {
      background: #fff7a6;
      padding: 2px 4px;
    }

    #reviewScreen {
      display: none;
      padding: 20px;
    }

    .review-item {
      background: white;
      border: 1px solid #ccc;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="main">

    <div id="passagePane">
      <h2>Reading Passage</h2>
      <div id="passageContent"></div>
    </div>

    <div id="questionPane">
      <div class="stickyHeader">
        <div id="progressText"></div>
        <div id="timer">10:00</div>
      </div>

      <div id="questionsContainer"></div>

      <button id="submitBtn" onclick="submitModule()"
        style="margin-top:20px;padding:12px;width:100%;border:none;border-radius:8px;background:#4a90e2;color:#fff;">
        Submit Answers
      </button>

      <div id="reviewScreen">
        <h2>Review Answers</h2>
        <div id="reviewList"></div>

        <button onclick="finishModule()"
          style="margin-top:20px;padding:12px;width:100%;border:none;border-radius:8px;background:#4a90e2;color:#fff;">
          Finish Module
        </button>
      </div>

    </div>
  </div>

  <script>
    /* ---------------- READ MODULE ID FROM URL ---------------- */
    const params = new URLSearchParams(window.location.search);
    let moduleId = params.get("id");

    if (!moduleId) {
      alert("Invalid module.");
      window.location.href = "reading-modules.html";
    }

    /* LEVEL DETECTION */
    let prefix = moduleId.split("-")[1]; // B, I, A
    let currentLevel =
      prefix === "B" ? "beginner" :
        prefix === "I" ? "intermediate" :
          prefix === "A" ? "advanced" :
            null;

    if (!currentLevel) {
      alert("Invalid module level.");
      window.location.href = "reading-modules.html";
    }

    let questionsData = [];
    let userAnswers = {};
    let timerSeconds = 600;
    let selectedInsert = null;

    /* ---------------- LOAD READING MODULE ---------------- */
    async function loadReading() {
      try {
        const res = await fetch(`content/reading/${currentLevel}.json`);
        const data = await res.json();

        /* FIND THE MODULE BY ID */
        let module = data.modules.find(m => m.id === moduleId);

        if (!module) {
          document.getElementById("passageContent").innerText = "Module not found.";
          return;
        }

        /* PASSAGE PROCESSING */
        let processed = module.passage
          .replace(/■/g, `<span class="insert-spot" onclick="selectInsert(this)">■</span>`)
          .replace(/\[HIGHLIGHT\](.*?)\[END\]/g, `<span class="toefl-highlight">$1</span>`);

        document.getElementById("passageContent").innerHTML = processed;

        questionsData = module.questions;
        renderQuestions();
        startTimer();

      } catch (e) {
        console.error(e);
        document.getElementById("passageContent").innerText = "Error loading data.";
      }
    }

    /* ---------------- RENDER QUESTIONS ---------------- */
    function renderQuestions() {
      const qBox = document.getElementById("questionsContainer");
      qBox.innerHTML = "";

      questionsData.forEach((q, i) => {
        let html = `<div class="question" id="q${i}">
      <h3>Q${i + 1}. ${q.question}</h3>`;

        if (q.type === "mcq") {
          for (let [key, val] of Object.entries(q.options)) {
            html += `
        <label class="optionLabel">
          <input type="radio" name="q${i}" value="${key}">
          (${key}) ${val}
        </label>`;
          }
        }

        if (q.type === "ctest") {
          html += `<p>${q.textBefore}
        <input class="ctest-input" maxlength="${q.gapLength}">
        ${q.textAfter}</p>`;
        }

        if (q.type === "insert") {
          html += `
        <p><strong>Sentence to insert:</strong> "${q.sentence}"</p>
        <p>Click on a ■ in the passage.</p>`;
        }

        html += `</div>`;
        qBox.innerHTML += html;
      });
    }

    /* ---------------- INSERT SENTENCE ---------------- */
    function selectInsert(el) {
      document.querySelectorAll(".insert-spot").forEach(s => s.classList.remove("selected"));
      el.classList.add("selected");
      selectedInsert = [...document.querySelectorAll(".insert-spot")].indexOf(el);
    }

    /* ---------------- TIMER ---------------- */
    function startTimer() {
      let interval = setInterval(() => {
        if (timerSeconds <= 0) {
          clearInterval(interval);
          return;
        }

        timerSeconds--;
        let m = Math.floor(timerSeconds / 60);
        let s = timerSeconds % 60;
        document.getElementById("timer").innerText =
          `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      }, 1000);
    }

    /* ---------------- COLLECT ---------------- */
    function collectAnswers() {
      userAnswers = {};

      questionsData.forEach((q, i) => {
        if (q.type === "mcq") {
          let selected = document.querySelector(`input[name="q${i}"]:checked`);
          userAnswers[i] = selected ? selected.value : null;
        }

        if (q.type === "ctest") {
          userAnswers[i] = document.querySelector(`#q${i} input`).value.trim();
        }

        if (q.type === "insert") {
          userAnswers[i] = selectedInsert;
        }
      });
    }

    /* ---------------- SCORE ---------------- */
    function calculateScore() {
      let score = 0;

      questionsData.forEach((q, i) => {
        if (q.type === "mcq" && userAnswers[i] === q.answer) score++;
        if (q.type === "ctest" && userAnswers[i].toLowerCase() === q.answer.toLowerCase()) score++;
        if (q.type === "insert" && Number(userAnswers[i]) === Number(q.correctSpot)) score++;
      });

      return Math.round((score / questionsData.length) * 100);
    }

    /* ---------------- SUBMIT ---------------- */
    function submitModule() {
      collectAnswers();
      timerSeconds = 0;
      showReview();
    }

    /* ---------------- REVIEW ---------------- */
    function showReview() {
      document.getElementById("questionsContainer").style.display = "none";
      document.getElementById("submitBtn").style.display = "none";

      const box = document.getElementById("reviewScreen");
      const list = document.getElementById("reviewList");

      box.style.display = "block";
      list.innerHTML = "";

      questionsData.forEach((q, i) => {
        let ans = userAnswers[i];
        let done = ans !== null && ans !== "" && ans !== undefined;

        list.innerHTML += `
      <div class="review-item">
        <strong>Q${i + 1}</strong> — ${done ? "Answered" : "Skipped"}
      </div>`;
      });
    }

    /* ---------------- FINISH ---------------- */
    function finishReading() {
      const percent = calculateScore();

      alert(`Score: ${percent}%`);
      window.location.href = "reading-modules.html";
    }

    loadReading();
  </script>

</body>

</html>
