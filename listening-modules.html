<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Listening Modules | FluencyForge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: "Poppins", sans-serif;
  margin: 0;
  padding: 0;
  background: #f5f7ff;
}

.container {
  width: 90%;
  max-width: 900px;
  margin: 40px auto;
  text-align: center;
}

h1 {
  font-size: 32px;
  margin-bottom: 20px;
}

.level-title {
  text-align: left;
  margin-top: 35px;
  margin-bottom: 10px;
  font-size: 22px;
  font-weight: 600;
}

.module-row {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 15px;
}

.module-card {
  width: 160px;
  height: 160px;
  background: white;
  border-radius: 12px;
  border: 2px solid #d8d8d8;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: 0.2s;
  position: relative;
}

.module-card:hover {
  border-color: #4a90e2;
  transform: translateY(-3px);
}

.locked {
  opacity: 0.4;
  pointer-events: none;
}

.lock-icon {
  font-size: 26px;
  position: absolute;
  top: 10px;
  right: 10px;
}

/* Progress Bar */
.progress-box {
  margin-top: 50px;
  text-align: left;
}

.progress-label {
  font-size: 18px;
  font-weight: 600;
}

.progress-bar {
  width: 100%;
  height: 14px;
  background: #ddd;
  border-radius: 7px;
  overflow: hidden;
  margin-top: 10px;
}

.progress-fill {
  height: 100%;
  background: #4a90e2;
  width: 0%;
  transition: width 0.5s ease;
}

.back-btn {
  margin-top: 40px;
  padding: 12px 20px;
  background: #4a90e2;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="container">

  <h1>Listening Practice</h1>

  <!-- BEGINNER -->
  <div class="level-title">Beginner Level</div>
  <div class="module-row" id="beginnerRow"></div>

  <!-- INTERMEDIATE -->
  <div class="level-title">Intermediate Level</div>
  <div class="module-row" id="intermediateRow"></div>

  <!-- ADVANCED -->
  <div class="level-title">Advanced Level</div>
  <div class="module-row" id="advancedRow"></div>

  <!-- PROGRESS BAR -->
  <div class="progress-box">
    <div class="progress-label">Overall Progress</div>
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <button class="back-btn" onclick="window.location.href='index.html'">← Back to Home</button>

</div>

<script>
const totalModules = 15; // 5 beginner + 5 intermediate + 5 advanced

// Load completed modules from localStorage
let completed = JSON.parse(localStorage.getItem("listeningCompleted") || "{}");

function createCard(level, num, row) {
  const id = `${level}-${num}`;
  const isLocked = getLockedStatus(level, num);

  const card = document.createElement("div");
  card.className = "module-card";
  if (isLocked) card.classList.add("locked");
  card.onclick = () => {
    window.location.href = `listening.html?level=${level}&module=${num}`;
  };

  card.innerHTML = `
    <div style="font-size:18px; font-weight:600;">Module ${num}</div>
    ${isLocked ? `<div class='lock-icon'>🔒</div>` : ""}
  `;

  document.getElementById(row).appendChild(card);
}

function getLockedStatus(level, num) {
  if (level === "beginner") return false;

  if (level === "intermediate") return num === 1 ? false : !completed[`beginner-${num-1}`];

  if (level === "advanced") return num === 1 ? false : !completed[`intermediate-${num-1}`];

  return true;
}

function loadAllModules() {
  for (let i = 1; i <= 5; i++) {
    createCard("beginner", i, "beginnerRow");
    createCard("intermediate", i, "intermediateRow");
    createCard("advanced", i, "advancedRow");
  }
}

// Update Progress Bar
function updateProgress() {
  const done = Object.keys(completed).length;
  const percent = Math.round((done / totalModules) * 100);
  document.getElementById("progressFill").style.width = percent + "%";
}

loadAllModules();
updateProgress();
</script>

</body>
</html>
