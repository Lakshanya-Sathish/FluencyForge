<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Writing Modules | FluencyForge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: #f5f7ff;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            width: 90%;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .level-title {
            text-align: left;
            margin-top: 35px;
            margin-bottom: 10px;
            font-size: 22px;
            font-weight: 600;
        }

        .module-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 15px;
        }

        .module-card {
            width: 160px;
            height: 160px;
            background: white;
            border-radius: 14px;
            border: 2px solid #d8d8d8;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            flex-direction: column;
            font-size: 18px;
            font-weight: 600;
        }

        .module-card:hover {
            border-color: #4a90e2;
            transform: translateY(-4px);
        }

        .completed {
            border-color: #43c267 !important;
        }

        .locked {
            opacity: 0.35;
            pointer-events: none;
        }

        .check-icon {
            color: #43c267;
            font-size: 26px;
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .lock-icon {
            color: #777;
            font-size: 26px;
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .progress-box {
            margin-top: 50px;
            text-align: left;
        }

        .progress-label {
            font-size: 18px;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 14px;
            background: #ddd;
            border-radius: 7px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: #4a90e2;
            width: 0%;
            transition: width 0.5s ease;
        }

        .back-btn {
            margin-top: 40px;
            padding: 12px 20px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Writing Practice</h1>

        <div class="level-title">Beginner Level</div>
        <div class="module-row" id="beginnerRow"></div>

        <div class="level-title">Intermediate Level</div>
        <div class="module-row" id="intermediateRow"></div>

        <div class="level-title">Advanced Level</div>
        <div class="module-row" id="advancedRow"></div>

        <div class="progress-box">
            <div class="progress-label">Overall Progress</div>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </div>

        <button class="back-btn" onclick="window.location.href='index.html'">← Back to Home</button>
    </div>

    <script>
        /* -------------------------------------------------
           MODULE LIST
        ------------------------------------------------- */
        const MODULES = {
            beginner: ["W-B-1", "W-B-2", "W-B-3", "W-B-4", "W-B-5"],
            intermediate: ["W-I-1", "W-I-2", "W-I-3", "W-I-4", "W-I-5"],
            advanced: ["W-A-1", "W-A-2", "W-A-3", "W-A-4", "W-A-5"]
        };

        const TOTAL = 15;

        /* Load completed modules */
        let completed = JSON.parse(localStorage.getItem("writingCompleted") || "{}");

        /* Unlock logic */
        let intermediateUnlocked =
            localStorage.getItem("writing-level-intermediate") === "unlocked";

        let advancedUnlocked =
            localStorage.getItem("writing-level-advanced") === "unlocked";

        function isLocked(level) {
            if (level === "beginner") return false;
            if (level === "intermediate") return !intermediateUnlocked;
            if (level === "advanced") return !advancedUnlocked;
            return true;
        }

        /* -------------------------------------------------
           CREATE MODULE CARD
        ------------------------------------------------- */
        function createCard(level, id, index, rowId) {
            const locked = isLocked(level);

            const card = document.createElement("div");
            card.className = "module-card";

            if (locked) card.classList.add("locked");
            if (completed[id]) card.classList.add("completed");

            card.onclick = () => {
                if (!locked) window.location.href = `writing.html?id=${id}`;
            };

            card.innerHTML = `
                ${completed[id] ? '<div class="check-icon">✔</div>' : ''}
                ${locked ? '<div class="lock-icon">🔒</div>' : ''}
                Module ${index + 1}
            `;

            document.getElementById(rowId).appendChild(card);
        }

        /* -------------------------------------------------
           LOAD ALL MODULES
        ------------------------------------------------- */
        function loadModules() {
            MODULES.beginner.forEach((id, i) =>
                createCard("beginner", id, i, "beginnerRow")
            );

            MODULES.intermediate.forEach((id, i) =>
                createCard("intermediate", id, i, "intermediateRow")
            );

            MODULES.advanced.forEach((id, i) =>
                createCard("advanced", id, i, "advancedRow")
            );
        }

        /* -------------------------------------------------
           UPDATE PROGRESS BAR
        ------------------------------------------------- */
        function updateProgress() {
            const done = Object.keys(completed).length;
            const percent = Math.round((done / TOTAL) * 100);
            document.getElementById("progressFill").style.width = percent + "%";
        }

        loadModules();
        updateProgress();
    </script>

    <script src="theme.js"></script>

</body>

</html>
