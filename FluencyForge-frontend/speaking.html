<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Speaking | FluencyForge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #f5f7ff;
      height: 100vh;

    }

    .main {
      display: flex;
      height: 100vh;
    }

    #leftPane {
      flex: 1;
      background: #ffffff;
      padding: 20px;
      overflow-y: auto;
      border-right: 2px solid #e2e2e2;
    }

    #rightPane {
      width: 40%;
      background: #fafafa;
      padding: 20px;
      overflow-y: auto;
      position: relative;
    }

    .stickyHeader {
      position: sticky;
      top: 0;
      background: #fafafa;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    #timer {
      font-weight: bold;
      background: #4a90e2;
      padding: 6px 12px;
      border-radius: 8px;
      color: white;
    }

    #micBtn,
    #submitBtn,
    #nextBtn {
      margin-top: 20px;
      padding: 12px 20px;
      width: 100%;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #micBtn {
      background: #4a90e2;
    }

    #submitBtn {
      background: #28a745;
    }

    #nextBtn {
      background: #6c63ff;
      display: none;
    }

    /* 🔥 FORCE AI FEEDBACK BOX TO ALWAYS STAY VISIBLE */
    #aiFeedbackBox {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      background: white;
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      line-height: 1.6;
      min-height: 80px;
    }
  </style>
</head>

<body>

  <div class="main">
    <div id="leftPane">
      <h2 id="taskHeader">Loading...</h2>
      <div id="readingContainer"></div>
      <div id="listeningContainer"></div>
      <div id="taskPrompt" style="margin-top:20px; font-size:18px;"></div>
    </div>

    <div id="rightPane">

      <div class="stickyHeader">
        <div id="taskProgress">Task 1 of 4</div>
        <div id="timer">01:00</div>
      </div>

      <button id="micBtn">🎤 Start Recording</button>
      <button id="submitBtn" onclick="submitTask()">Submit Task</button>
      <button id="nextBtn" onclick="goNextTask()">Next Task →</button>

      <div id="aiFeedbackBox">AI Evaluation will appear here.</div>

    </div>
  </div>

  <script>
    // =====================================================
    // CONFIG
    // =====================================================

    // TEMPORARILY use your local backend.
    // Later we will replace this with your Vercel backend URL.
    const API_BASE = "http://127.0.0.1:3001";

    const params = new URLSearchParams(window.location.search);
    const moduleId = params.get("id");

    let tasks = [];
    let current = 0;

    // Speech recognition
    let recognition = null;
    let recording = false;
    let transcript = "";

    // =====================================================
    // DETERMINE LEVEL
    // =====================================================

    let level =
      moduleId && moduleId.includes("-B") ? "beginner" :
        moduleId && moduleId.includes("-I") ? "intermediate" :
          "advanced";


    // =====================================================
    // SPEECH RECOGNITION
    // =====================================================

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognition) {

      recognition = new SpeechRecognition();

      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "en-US";

      recognition.onstart = () => {
        console.log("Speech recognition started");
        recording = true;

        document.getElementById("micBtn").innerText =
          "⏹ Stop Speaking";
      };

      recognition.onresult = (event) => {

        let finalTranscript = "";
        let interimTranscript = "";

        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          const result = event.results[i];

          if (result.isFinal) {
            finalTranscript += result[0].transcript + " ";
          } else {
            interimTranscript += result[0].transcript;
          }
        }

        transcript += finalTranscript;

        console.log(
          "Transcript:",
          transcript + interimTranscript
        );

        // Show live transcript
        showAIFeedback(`
        <strong>Your response:</strong><br><br>
        ${escapeHTML(transcript + interimTranscript)}
      `);
      };


      recognition.onerror = (event) => {

        console.error(
          "Speech recognition error:",
          event.error
        );

        recording = false;

        document.getElementById("micBtn").innerText =
          "🎤 Start Speaking";

        if (event.error === "not-allowed") {

          showAIFeedback(
            "⚠️ Microphone permission was denied.<br>" +
            "Please allow microphone access and try again."
          );

        } else {

          showAIFeedback(
            "⚠️ Speech recognition failed.<br>" +
            "Please try speaking again."
          );
        }
      };


      recognition.onend = () => {

        console.log("Speech recognition ended");

        if (recording) {
          try {
            recognition.start();
          } catch (error) {
            console.log("Recognition restart skipped.");
          }
        }
      };

    } else {

      document.getElementById("micBtn").disabled = true;

      showAIFeedback(
        "⚠️ Speech recognition is not supported in this browser.<br>" +
        "Please use Google Chrome or Microsoft Edge."
      );
    }


    // =====================================================
    // LOAD SPEAKING CONTENT
    // =====================================================

    async function loadSpeaking() {

      try {

        const res =
          await fetch(`content/speaking/${level}.json`);

        if (!res.ok) {
          throw new Error("Unable to load speaking content.");
        }

        const data = await res.json();

        const selectedModule =
          data.modules.find(m => m.id === moduleId);

        if (!selectedModule) {

          throw new Error(
            "Speaking module not found: " + moduleId
          );
        }

        tasks = selectedModule.tasks;

        loadTask();

      } catch (error) {

        console.error("CONTENT ERROR:", error);

        showAIFeedback(
          "⚠️ Unable to load this speaking module."
        );
      }
    }


    // =====================================================
    // LOAD CURRENT TASK
    // =====================================================

    function loadTask() {

      const t = tasks[current];

      document.getElementById("taskHeader").innerText =
        `${t.type.toUpperCase()} Task`;

      document.getElementById("taskProgress").innerText =
        `Task ${current + 1} of ${tasks.length}`;

      document.getElementById("readingContainer").innerHTML =
        t.reading
          ? `<div class="readingBlock">${t.reading}</div>`
          : "";

      document.getElementById("listeningContainer").innerHTML =
        t.audio
          ? `<audio controls src="${t.audio}"></audio>`
          : "";

      document.getElementById("taskPrompt").innerHTML =
        `<strong>Task:</strong> ${t.task}`;


      // Reset transcript
      transcript = "";
      recording = false;


      // Reset buttons
      document.getElementById("micBtn").innerText =
        "🎤 Start Speaking";

      document.getElementById("micBtn").disabled =
        !SpeechRecognition;

      document.getElementById("submitBtn").style.display =
        "block";

      document.getElementById("nextBtn").style.display =
        "none";


      showAIFeedback(
        "Your AI evaluation will appear here after you submit your response."
      );
    }


    // =====================================================
    // MICROPHONE BUTTON
    // =====================================================

    document.getElementById("micBtn").onclick = () => {

      if (!recognition) {

        alert(
          "Speech recognition is not supported. Please use Chrome or Edge."
        );

        return;
      }

      if (recording) {
        stopRecording();
      } else {
        startRecording();
      }
    };


    // =====================================================
    // START SPEAKING
    // =====================================================

    function startRecording() {

      transcript = "";
      recording = true;

      showAIFeedback(
        "<strong>🎤 Listening...</strong><br><br>" +
        "Start speaking. Your response will appear here."
      );

      try {

        recognition.start();

      } catch (error) {

        console.error(
          "Recognition start error:",
          error
        );

        recording = false;
      }
    }


    // =====================================================
    // STOP SPEAKING
    // =====================================================

    function stopRecording() {

      recording = false;

      if (recognition) {
        recognition.stop();
      }

      document.getElementById("micBtn").innerText =
        "🎤 Start Speaking";

      console.log(
        "Final transcript:",
        transcript
      );
    }


    // =====================================================
    // SUBMIT TASK
    // =====================================================

    async function submitTask() {

      if (!transcript || transcript.trim().length === 0) {

        alert(
          "Please record your answer first."
        );

        return;
      }

      // Make sure recognition has stopped
      if (recording) {
        stopRecording();
      }

      const submitBtn =
        document.getElementById("submitBtn");

      submitBtn.disabled = true;
      submitBtn.innerText = "Evaluating...";

      showAIFeedback(
        "<em>🤖 Claude is evaluating your response...</em>"
      );


      try {

        const res =
          await fetch(
            `${API_BASE}/api/evaluate-speaking`,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                transcript: transcript,
                moduleId: moduleId
              })
            }
          );


        if (!res.ok) {

          const errorText =
            await res.text();

          throw new Error(
            errorText || "Server error"
          );
        }


        const data =
          await res.json();


        console.log(
          "CLAUDE RESPONSE:",
          data
        );


        showAIFeedback(
          formatFeedback(
            data.feedback || "No feedback returned."
          )
        );


        document.getElementById("nextBtn").style.display =
          "block";

        submitBtn.style.display =
          "none";


      } catch (error) {

        console.error(
          "AI ERROR:",
          error
        );

        showAIFeedback(
          "⚠️ AI evaluation failed.<br><br>" +
          "Please try again."
        );

        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Task";
      }
    }


    // =====================================================
    // FORMAT CLAUDE RESPONSE
    // =====================================================

    function formatFeedback(text) {

      return `
      <div>
        <strong>Your Transcript</strong>

        <p>
          ${escapeHTML(transcript)}
        </p>

        <hr>

        <strong>Claude's Evaluation</strong>

        <p>
          ${escapeHTML(text)
          .replace(/\n/g, "<br>")}
        </p>
      </div>
    `;
    }


    // =====================================================
    // SHOW AI FEEDBACK
    // =====================================================

    function showAIFeedback(text) {

      const box =
        document.getElementById("aiFeedbackBox");

      box.style.display = "block";
      box.style.visibility = "visible";
      box.style.opacity = "1";

      box.innerHTML =
        `<h2>AI Evaluation</h2>${text}`;
    }


    // =====================================================
    // NEXT TASK
    // =====================================================

    function goNextTask() {

      if (current < tasks.length - 1) {

        current++;

        loadTask();

      } else {

        showAIFeedback(
          "🎉 Module Completed!"
        );

        document.getElementById("nextBtn").style.display =
          "none";
      }
    }


    // =====================================================
    // HTML ESCAPE
    // =====================================================

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }


    // =====================================================
    // START
    // =====================================================

    loadSpeaking();

  </script>

</body>

</html>
