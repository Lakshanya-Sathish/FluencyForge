<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Speaking | FluencyForge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #f5f7ff;
      height: 100vh;

    }

    .main {
      display: flex;
      height: 100vh;
    }

    #leftPane {
      flex: 1;
      background: #ffffff;
      padding: 20px;
      overflow-y: auto;
      border-right: 2px solid #e2e2e2;
    }

    #rightPane {
      width: 40%;
      background: #fafafa;
      padding: 20px;
      overflow-y: auto;
      position: relative;
    }

    .stickyHeader {
      position: sticky;
      top: 0;
      background: #fafafa;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    #timer {
      font-weight: bold;
      background: #4a90e2;
      padding: 6px 12px;
      border-radius: 8px;
      color: white;
    }

    #micBtn,
    #submitBtn,
    #nextBtn {
      margin-top: 20px;
      padding: 12px 20px;
      width: 100%;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #micBtn {
      background: #4a90e2;
    }

    #submitBtn {
      background: #28a745;
    }

    #nextBtn {
      background: #6c63ff;
      display: none;
    }

    /* 🔥 FORCE AI FEEDBACK BOX TO ALWAYS STAY VISIBLE */
    #aiFeedbackBox {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      background: white;
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      line-height: 1.6;
      min-height: 80px;
    }
  </style>
</head>

<body>

  <div class="main">
    <div id="leftPane">
      <h2 id="taskHeader">Loading...</h2>
      <div id="readingContainer"></div>
      <div id="listeningContainer"></div>
      <div id="taskPrompt" style="margin-top:20px; font-size:18px;"></div>
    </div>

    <div id="rightPane">

      <div class="stickyHeader">
        <div id="taskProgress">Task 1 of 4</div>
        <div id="timer">01:00</div>
      </div>

      <button id="micBtn">🎤 Start Recording</button>
      <button id="submitBtn" onclick="submitTask()">Submit Task</button>
      <button id="nextBtn" onclick="goNextTask()">Next Task →</button>

      <div id="aiFeedbackBox">AI Evaluation will appear here.</div>

    </div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:3001";
    let params = new URLSearchParams(window.location.search);
    let moduleId = params.get("id");

    let tasks = [];
    let current = 0;
    let recorder;
    let audioChunks = [];
    let recording = false;

    let level =
      moduleId.includes("-B") ? "beginner" :
        moduleId.includes("-I") ? "intermediate" : "advanced";

    async function loadSpeaking() {
      const res = await fetch(`content/speaking/${level}.json`);
      const data = await res.json();
      tasks = data.modules.find(m => m.id === moduleId).tasks;
      loadTask();
    }

    function loadTask() {
      const t = tasks[current];

      document.getElementById("taskHeader").innerText = `${t.type.toUpperCase()} Task`;
      document.getElementById("taskProgress").innerText = `Task ${current + 1} of ${tasks.length}`;

      document.getElementById("readingContainer").innerHTML =
        t.reading ? `<div class="readingBlock">${t.reading}</div>` : "";

      document.getElementById("listeningContainer").innerHTML =
        t.audio ? `<audio controls src="${t.audio}"></audio>` : "";

      document.getElementById("taskPrompt").innerHTML =
        `<strong>Task:</strong> ${t.task}`;

      // RESET FEEDBACK BOX — BUT KEEP IT VISIBLE
      showAIFeedback("Waiting for your answer...");
      document.getElementById("nextBtn").style.display = "none";
      document.getElementById("submitBtn").style.display = "block";
    }

    document.getElementById("micBtn").onclick = () =>
      recording ? stopRecording() : startRecording();

    async function startRecording() {
      let stream = await navigator.mediaDevices.getUserMedia({ audio: true });

      recorder = new MediaRecorder(stream);
      audioChunks = [];

      recorder.ondataavailable = e => audioChunks.push(e.data);
      recorder.start();
      recording = true;

      document.getElementById("micBtn").innerText = "⏹ Stop Recording";
    }

    function stopRecording() {
      recording = false;
      recorder.stop();

      recorder.onstop = () => {
        let blob = new Blob(audioChunks, { type: "audio/webm" });
        tasks[current].userAudio = blob;
        sendForAI(blob);
      };

      document.getElementById("micBtn").innerText = "🎤 Start Recording";
    }

    async function sendForAI(blob) {
      const fd = new FormData();
      fd.append("audio", new File([blob], "speech.webm", { type: "audio/webm" }));
      fd.append("moduleId", moduleId);

      showAIFeedback("<em>Evaluating... please wait</em>");

      try {
        const res = await fetch(`${API_BASE}/api/evaluate-speaking`, {
          method: "POST",
          body: fd
        });

        if (!res.ok) {
          const errorText = await res.text();
          throw new Error(errorText || "Server error");
        }

        const data = await res.json();

        showAIFeedback(data.feedback || "No feedback returned");
        document.getElementById("nextBtn").style.display = "block";
        document.getElementById("submitBtn").style.display = "none";

      } catch (err) {
        console.error("AI ERROR:", err);
        showAIFeedback(
          "⚠️ AI evaluation failed.<br>Please try recording again."
        );
      }
    }

    function showAIFeedback(text) {
      const box = document.getElementById("aiFeedbackBox");

      box.style.display = "block";
      box.style.visibility = "visible";
      box.style.opacity = "1";

      box.innerHTML = `<h2>AI Evaluation</h2>${text.replace(/\n/g, "<br>")}`;
    }

    function submitTask() {
      if (!tasks[current].userAudio) {
        alert("Record your answer first.");
        return;
      }
      document.getElementById("nextBtn").style.display = "block";
      document.getElementById("submitBtn").style.display = "none";
    }

    function goNextTask() {
      if (current < tasks.length - 1) {
        current++;
        loadTask();
      } else {
        showAIFeedback("🎉 Module Completed!");
      }
    }

    loadSpeaking();
  </script>

</body>

</html>
