<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Your Progress | FluencyForge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Poppins, sans-serif;
      background: #f5f7ff;
      margin: 0;
    }

    h1 {
      text-align: center;
      margin-top: 25px;
      font-size: 32px;
    }

    .card {
      background: #fff;
      width: 85%;
      max-width: 900px;
      margin: 25px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.06);
    }

    .skill-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .level-title {
      font-size: 16px;
      margin-top: 10px;
      margin-bottom: 6px;
      text-transform: capitalize;
    }

    .bar {
      width: 100%;
      height: 12px;
      background: #ddd;
      border-radius: 6px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: #4a90e2;
      width: 0%;
      transition: width 0.4s ease;
    }
  </style>
</head>

<body>

  <h1>Your Progress</h1>

  <div class="card" id="speakingCard"></div>
  <div class="card" id="writingCard"></div>
  <div class="card" id="listeningCard"></div>
  <div class="card" id="readingCard"></div>

  <script>
    /* -----------------------------------------------------
       SAFE DEFAULT PROGRESS (fallback if nothing stored)
    ----------------------------------------------------- */
    const defaultProgress = {
      speaking: {
        beginner: 0,
        intermediate: 0,
        advanced: 0
      },
      writing: {
        beginner: 0,
        intermediate: 0,
        advanced: 0
      },
      listening: {
        beginner: 0,
        intermediate: 0,
        advanced: 0
      },
      reading: {
        beginner: 0,
        intermediate: 0,
        advanced: 0
      }
    };

    /* Load from localStorage OR fallback */
    const progress = JSON.parse(localStorage.getItem("progress")) || defaultProgress;

    /* -----------------------------------------------------
       RENDER FUNCTION FOR EACH SKILL
    ----------------------------------------------------- */
    function renderSkill(cardId, title, skillData) {
      let html = `<div class="skill-title">${title}</div>`;

      for (let lvl in skillData) {
        let val = skillData[lvl];

        /* TRUE means 100%, null means 0% */
        if (val === true) val = 100;
        if (val === null) val = 0;

        html += `
                    <div class="level-title">${lvl}</div>
                    <div class="bar">
                        <div class="fill" style="width:${val}%"></div>
                    </div>
                `;
      }

      document.getElementById(cardId).innerHTML = html;
    }

    /* -----------------------------------------------------
       RENDER ALL 4 SECTIONS
    ----------------------------------------------------- */
    renderSkill("speakingCard", "Speaking", progress.speaking);
    renderSkill("writingCard", "Writing", progress.writing);
    renderSkill("listeningCard", "Listening", progress.listening);
    renderSkill("readingCard", "Reading", progress.reading);
  </script>

</body>

</html>
