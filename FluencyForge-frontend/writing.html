<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Writing Task | FluencyForge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #f5f7ff;
      height: 100vh;
      overflow: hidden;
    }

    .main {
      display: flex;
      height: 100vh;
    }

    #readingPane {
      flex: 1;
      background: #ffffff;
      padding: 20px;
      overflow-y: auto;
      border-right: 2px solid #e2e2e2;
    }

    #writingPane {
      width: 45%;
      background: #fafafa;
      padding: 20px;
      overflow-y: auto;
      position: relative;
    }

    .stickyHeader {
      position: sticky;
      top: 0;
      background: #fafafa;
      padding: 12px 0;
      z-index: 100;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #timer {
      font-weight: bold;
      background: #4a90e2;
      padding: 6px 12px;
      border-radius: 8px;
      color: #fff;
    }

    #wordCount {
      font-weight: 600;
    }

    #wordLimitStatus {
      font-weight: 600;
      margin-top: 6px;
    }

    textarea {
      width: 100%;
      height: 350px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: none;
      font-size: 15px;
      font-family: "Poppins", sans-serif;
    }

    .submit-btn,
    .completed-btn {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .submit-btn {
      background: #4a90e2;
      color: #fff;
    }

    .completed-btn {
      background: #43c267;
      color: #fff;
    }

    #reviewScreen {
      display: none;
      padding: 10px;
    }
  </style>
</head>

<body>

  <div class="main">
    <div id="readingPane">
      <h2 id="taskTitle"></h2>

      <h3 id="readingHeader" style="display:none;">Reading Passage</h3>
      <div id="readingContent"></div>

      <h3 style="margin-top:20px;">Prompt</h3>
      <div id="promptContent"></div>
    </div>

    <div id="writingPane">
      <div class="stickyHeader">
        <div id="wordCount">Words: 0</div>
        <div id="timer">00:00</div>
      </div>

      <div id="wordLimitStatus"></div>

      <textarea id="userResponse" placeholder="Start writing here..."></textarea>

      <button class="submit-btn" onclick="handleNext()">Next Task</button>

      <div id="reviewScreen">
        <h2>Review Complete</h2>
        <p>Your answer has been evaluated.</p>
        <button class="completed-btn" onclick="finishWriting()">Finish Module</button>
      </div>

      <div id="aiFeedbackBox"
        style="display:none;background:white;border:1px solid #ddd;padding:20px;border-radius:10px;line-height:1.6;margin-top:20px;">
      </div>

    </div>
  </div>

  <script>
    /* ============================================================
       BACKEND BASE URL  (EDIT THIS ONLY)
    ============================================================ */
    const API_BASE = "http://localhost:3001";

    /* ============================================================
       MODULE + LEVEL
    ============================================================ */
    const params = new URLSearchParams(window.location.search);
    const moduleId = params.get("id");
    if (!moduleId) window.location.href = "writing-modules.html";

    const levelCode = moduleId.split("-")[1];
    const level =
      levelCode === "B" ? "beginner" :
        levelCode === "I" ? "intermediate" : "advanced";

    let currentTaskIndex = 0;
    let moduleData = null;

    /* TIMER */
    const INTEGRATED_TIME = 20 * 60;
    const INDEPENDENT_TIME = 30 * 60;
    let seconds = 0;
    let timerInterval;

    /* WORD LIMITS */
    const INTEGRATED_MIN = 150, INTEGRATED_MAX = 225;
    const INDEPENDENT_MIN = 300, INDEPENDENT_MAX = 400;

    /* ============================================================
       LOAD MODULE
    ============================================================ */
    async function loadModule() {
      const res = await fetch(`content/writing/${level}.json`);
      const data = await res.json();

      moduleData = data.modules.find(m => m.id === moduleId);

      loadTask();
    }

    /* ============================================================
       LOAD TASK
    ============================================================ */
    function loadTask() {
      const task = moduleData.tasks[currentTaskIndex];

      document.getElementById("taskTitle").textContent =
        `Task ${currentTaskIndex + 1} (${task.type.toUpperCase()})`;

      document.getElementById("promptContent").innerHTML = task.task;

      if (task.type === "integrated") {
        document.getElementById("readingHeader").style.display = "block";
        document.getElementById("readingContent").innerHTML = task.reading;
        seconds = INTEGRATED_TIME;
      } else {
        document.getElementById("readingHeader").style.display = "none";
        document.getElementById("readingContent").innerHTML = "";
        seconds = INDEPENDENT_TIME;
      }

      const saved = localStorage.getItem(`write-${moduleId}-task${currentTaskIndex}`);
      document.getElementById("userResponse").value = saved || "";
      updateWordCount();

      startTimer();
    }

    /* ============================================================
       TIMER
    ============================================================ */
    function startTimer() {
      clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        if (seconds <= 0) return;

        seconds--;
        let m = Math.floor(seconds / 60);
        let s = seconds % 60;

        document.getElementById("timer").textContent =
          `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      }, 1000);
    }

    /* ============================================================
       WORD COUNT
    ============================================================ */
    function updateWordCount() {
      const text = userResponse.value.trim();
      const words = text ? text.split(/\s+/).length : 0;

      document.getElementById("wordCount").textContent = `Words: ${words}`;

      const task = moduleData.tasks[currentTaskIndex];
      if (task.type === "integrated")
        validateWordLimit(words, INTEGRATED_MIN, INTEGRATED_MAX);
      else
        validateWordLimit(words, INDEPENDENT_MIN, INDEPENDENT_MAX);

      localStorage.setItem(`write-${moduleId}-task${currentTaskIndex}`, userResponse.value);
    }

    function validateWordLimit(words, min, max) {
      const status = document.getElementById("wordLimitStatus");

      if (words < min) {
        status.style.color = "red";
        status.textContent = `Need at least ${min} words`;
      } else if (words > max) {
        status.style.color = "orange";
        status.textContent = `Above recommended limit (${max})`;
      } else {
        status.style.color = "green";
        status.textContent = "Within required word range ✔";
      }
    }

    userResponse.addEventListener("input", updateWordCount);

    /* ============================================================
       NEXT BUTTON
    ============================================================ */
    function handleNext() {
      clearInterval(timerInterval);

      currentTaskIndex++;

      if (currentTaskIndex >= moduleData.tasks.length) {
        evaluateFinalWriting();
      } else {
        loadTask();
      }
    }

    /* ============================================================
       AI EVALUATION
    ============================================================ */
    async function evaluateFinalWriting() {
      const text = userResponse.value.trim();

      const res = await fetch(`${API_BASE}/api/evaluate-writing`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ moduleId, text })
      });

      const data = await res.json();

      showAIFeedback(data.feedback);
      applyAdaptiveUnlock(data.score);

      document.getElementById("userResponse").style.display = "none";
      document.querySelector(".submit-btn").style.display = "none";
      document.getElementById("reviewScreen").style.display = "block";
    }

    /* ============================================================
       SHOW FEEDBACK
    ============================================================ */
    function showAIFeedback(feed) {
      const box = document.getElementById("aiFeedbackBox");
      box.style.display = "block";
      box.innerHTML = `
        <h2>AI Evaluation</h2>
        <p>${feed.replace(/\n/g, "<br>")}</p>
      `;
    }

    /* ============================================================
       ADAPTIVE UNLOCK
    ============================================================ */
    function applyAdaptiveUnlock(score) {
      const n = Number(score);

      if (n >= 85) {
        localStorage.setItem("writing-level-intermediate", "unlocked");
        localStorage.setItem("writing-level-advanced", "unlocked");
      } else if (n >= 70) {
        localStorage.setItem("writing-level-intermediate", "unlocked");
      }

      let done = JSON.parse(localStorage.getItem("writingCompleted") || "{}");
      done[moduleId] = true;
      localStorage.setItem("writingCompleted", JSON.stringify(done));

      updateProgressStore();
    }

    /* ============================================================
       UPDATE PROGRESS PAGE
    ============================================================ */
    function updateProgressStore() {
      let progress = JSON.parse(localStorage.getItem("progress")) || {
        speaking: { beginner: 0, intermediate: 0, advanced: 0 },
        writing: { beginner: 0, intermediate: 0, advanced: 0 },
        listening: { beginner: 0, intermediate: 0, advanced: 0 },
        reading: { beginner: 0, intermediate: 0, advanced: 0 }
      };

      if (level === "beginner") progress.writing.beginner = 100;
      if (level === "intermediate") progress.writing.intermediate = 100;
      if (level === "advanced") progress.writing.advanced = 100;

      localStorage.setItem("progress", JSON.stringify(progress));
    }

    /* ============================================================
       FINISH MODULE
    ============================================================ */
    function finishWriting() {
      window.location.href = "writing-modules.html";
    }

    loadModule();
  </script>

  <script src="theme.js"></script>

</body>

</html>
