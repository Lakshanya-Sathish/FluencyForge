<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Listening | FluencyForge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ====== SAME UI — UNTOUCHED ====== */
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #f0f3ff;
      height: 100vh;
      overflow: hidden;
    }

    .main {
      display: flex;
      height: 100vh;
    }

    #audioPane {
      width: 42%;
      background: #ffffff;
      padding: 25px;
      border-right: 2px solid #e2e2e2;
      overflow-y: auto;
    }

    #audioPane h2 {
      margin: 0 0 10px;
    }

    #audioPlayer {
      width: 100%;
      margin-top: 20px;
      border-radius: 8px;
    }

    #questionPane {
      flex: 1;
      background: #f7f8ff;
      padding: 20px;
      overflow-y: auto;
    }

    .stickyHeader {
      position: sticky;
      top: 0;
      background: #f7f8ff;
      z-index: 100;
      padding: 10px 0;
      border-bottom: 1px solid #ccc;
      display: flex;
      justify-content: space-between;
    }

    #progressText {
      font-weight: 600;
      font-size: 16px;
    }

    #timer {
      font-weight: 700;
      background: #4a90e2;
      padding: 6px 12px;
      border-radius: 8px;
      color: white;
    }

    .question {
      margin: 22px 0;
      padding: 20px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #ddd;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .question h3 {
      margin-top: 0;
    }

    .optionLabel {
      display: block;
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 6px;
    }

    .optionLabel:hover {
      background: #eef3ff;
    }

    .fill-input {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #aaa;
      width: 230px;
      font-size: 15px;
    }

    select {
      padding: 7px;
      border-radius: 6px;
      border: 1px solid #aaa;
      font-size: 15px;
    }

    .drop-zone {
      padding: 12px;
      border: 2px dashed #4a90e2;
      border-radius: 10px;
      min-height: 45px;
      margin-top: 10px;
      background: #f0f4ff;
    }

    .draggable {
      padding: 8px 12px;
      background: #dfe4ff;
      border-radius: 6px;
      display: inline-block;
      margin: 5px;
      cursor: grab;
      font-size: 14px;
      font-weight: 500;
    }

    button {
      cursor: pointer;
    }

    .btn-primary {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border: none;
      background: #4a90e2;
      color: white;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #3a7ccd;
    }

    #reviewScreen {
      display: none;
    }

    .review-item {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #fff;
      margin: 8px 0;
    }
  </style>

</head>

<body>

  <div class="main">

    <div id="audioPane">
      <h2>Listening Audio</h2>
      <audio id="audioPlayer" controls></audio>
    </div>

    <div id="questionPane">
      <div class="stickyHeader">
        <div id="progressText">Question 1</div>
        <div id="timer">07:00</div>
      </div>

      <div id="questionsContainer"></div>

      <button id="submitBtn" class="btn-primary" onclick="submitModule()">Submit Answers</button>

      <div id="reviewScreen">
        <h2>Review</h2>
        <div id="reviewList"></div>

        <button class="btn-primary" onclick="finishListening()">Finish Module</button>
      </div>
    </div>

  </div>


  <script>
    /* ========== URL PARAMS ========= */
    const params = new URLSearchParams(window.location.search);
    let currentLevel = params.get("level") || "beginner";
    let currentModule = parseInt(params.get("module") || "1");

    let timerSeconds = 420;
    let questionsData = [];
    let userAnswers = {};

    /* ========== LOAD LISTENING ========= */
    async function loadListening() {
      const res = await fetch(`content/listening/${currentLevel}.json`);
      const data = await res.json();

      let module = data.modules[currentModule - 1];

      document.getElementById("audioPlayer").src = module.audio;

      questionsData = module.questions;

      renderQuestions();
      startTimer();
    }

    /* RENDER QUESTIONS (unchanged) */
    function renderQuestions() {
      const box = document.getElementById("questionsContainer");
      box.innerHTML = "";

      questionsData.forEach((q, i) => {
        let html = `<div class="question"><h3>Q${i + 1}. ${q.question}</h3>`;

        if (q.type === "mcq") {
          Object.entries(q.options).forEach(([key, val]) => {
            html += `
          <label class="optionLabel">
            <input type="radio" name="q${i}" value="${key}">
            (${key}) ${val}
          </label>`;
          });
        }

        if (q.type === "multi") {
          Object.entries(q.options).forEach(([key, val]) => {
            html += `
          <label class="optionLabel">
            <input type="checkbox" name="q${i}" value="${key}">
            (${key}) ${val}
          </label>`;
          });
        }

        if (q.type === "match") {
          Object.entries(q.pairs).forEach(([left, right]) => {
            html += `
          <p><strong>${left}</strong></p>
          <select id="match_${i}_${left}">
            <option value="">Select...</option>
            ${Object.values(q.pairs).map(v => `<option value="${v}">${v}</option>`)}
          </select>`;
          });
        }

        if (q.type === "categorize") {
          q.categories.forEach(cat => {
            html += `<p><strong>${cat}</strong></p>
                 <div class="drop-zone" id="cat_${i}_${cat}" 
                 ondrop="drop(event)" ondragover="allowDrop(event)"></div>`;
          });

          html += `<div>`;
          q.items.forEach((item, idx) => {
            html += `<div class="draggable" draggable="true" id="drag_${i}_${idx}" 
                 ondragstart="drag(event)">${item}</div>`;
          });
          html += `</div>`;
        }

        html += `</div>`;
        box.innerHTML += html;
      });
    }

    /* DRAG-DROP */
    function allowDrop(e) { e.preventDefault(); }
    function drag(e) { e.dataTransfer.setData("id", e.target.id); }
    function drop(e) {
      e.preventDefault();
      const id = e.dataTransfer.getData("id");
      const text = document.getElementById(id).innerText;
      e.target.innerHTML += `<div>${text}</div>`;
    }

    /* TIMER */
    function startTimer() {
      setInterval(() => {
        if (timerSeconds <= 0) return;

        timerSeconds--;
        let m = Math.floor(timerSeconds / 60);
        let s = timerSeconds % 60;

        document.getElementById("timer").innerText =
          `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      }, 1000);
    }

    /* COLLECT ANSWERS */
    function collectAnswers() {
      questionsData.forEach((q, i) => {

        if (q.type === "mcq") {
          const sel = document.querySelector(`input[name="q${i}"]:checked`);
          userAnswers[i] = sel ? sel.value : null;
        }

        if (q.type === "multi") {
          userAnswers[i] =
            [...document.querySelectorAll(`input[name="q${i}"]:checked`)]
              .map(x => x.value);
        }

        if (q.type === "match") {
          let obj = {};
          Object.keys(q.pairs).forEach(left => {
            obj[left] = document.getElementById(`match_${i}_${left}`).value;
          });
          userAnswers[i] = obj;
        }

        if (q.type === "categorize") {
          let obj = {};
          q.categories.forEach(cat => {
            let zone = document.getElementById(`cat_${i}_${cat}`);
            obj[cat] = [...zone.querySelectorAll("div")]
              .map(d => d.innerText.trim());
          });
          userAnswers[i] = obj;
        }

      });
    }

    /* SCORE */
    function calculateScore() {
      let score = 0;

      questionsData.forEach((q, i) => {
        const ua = userAnswers[i];

        if (q.type === "mcq" && ua === q.answer) score++;

        if (q.type === "multi") {
          const correct = q.answers.sort().join(",");
          const user = ua.sort().join(",");
          if (correct === user) score++;
        }

        if (q.type === "match") {
          let ok = true;
          Object.keys(q.pairs).forEach(left => {
            if (ua[left] !== q.pairs[left]) ok = false;
          });
          if (ok) score++;
        }

        if (q.type === "categorize") {
          let ok = true;
          Object.entries(q.answers).forEach(([cat, items]) => {
            const u = ua[cat] || [];
            if (u.length !== items.length) ok = false;
            items.forEach(item => { if (!u.includes(item)) ok = false; });
          });
          if (ok) score++;
        }
      });

      return Math.round((score / questionsData.length) * 100);
    }

    /* SUBMIT */
    function submitModule() {
      collectAnswers();
      showReview();
    }

    /* REVIEW */
    function showReview() {
      document.getElementById("questionsContainer").style.display = "none";
      document.getElementById("submitBtn").style.display = "none";

      const review = document.getElementById("reviewScreen");
      const list = document.getElementById("reviewList");

      review.style.display = "block";
      list.innerHTML = "";

      questionsData.forEach((_, i) => {
        let status = userAnswers[i] ? "Answered" : "Skipped";
        list.innerHTML += `<div class="review-item">Q${i + 1} — ${status}</div>`;
      });
    }

    /* ====== FINISH + ADAPTIVE UNLOCK ====== */
    function finishListening() {
      const percent = calculateScore();

      /* Save module completion */
      let completed = JSON.parse(localStorage.getItem("listeningCompleted") || "{}");
      completed[`${currentLevel}-${currentModule}`] = true;
      localStorage.setItem("listeningCompleted", JSON.stringify(completed));

      /* LEVEL UNLOCKING */
      if (currentLevel === "beginner" && percent >= 80) {
        localStorage.setItem("listening-level-intermediate", "unlocked");
      }

      if (currentLevel === "intermediate" && percent >= 85) {
        localStorage.setItem("listening-level-advanced", "unlocked");
      }

      alert(`Score: ${percent}%`);

      window.location.href = "listening-modules.html";
    }

    loadListening();
  </script>
  <script src="theme.js"></script>

</body>

</html>
