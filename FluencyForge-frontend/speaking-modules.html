<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Speaking Modules | FluencyForge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #f5f7ff;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 40px auto;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    .level-title {
      text-align: left;
      margin-top: 35px;
      margin-bottom: 10px;
      font-size: 22px;
      font-weight: 600;
    }

    .module-row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: flex-start;
    }

    .module-card {
      width: 160px;
      height: 160px;
      background: white;
      border-radius: 14px;
      border: 2px solid #d8d8d8;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: relative;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .module-card:hover {
      border-color: #4a90e2;
      transform: translateY(-4px);
    }

    .locked {
      opacity: 0.35;
      pointer-events: none;
    }

    .check-icon,
    .lock-icon {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 26px;
    }

    .check-icon {
      color: #28a745;
    }

    .lock-icon {
      color: #777;
    }

    /* Progress */
    .progress-box {
      margin-top: 50px;
      text-align: left;
    }

    .progress-label {
      font-size: 18px;
      font-weight: 600;
    }

    .progress-bar {
      width: 100%;
      height: 14px;
      background: #ddd;
      border-radius: 7px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      background: #4a90e2;
      width: 0%;
      transition: width 0.5s;
    }

    .back-btn {
      margin-top: 40px;
      padding: 12px 20px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Speaking Practice</h1>

    <!-- Beginner -->
    <div class="level-title">Beginner Level</div>
    <div class="module-row" id="beginnerRow"></div>

    <!-- Intermediate -->
    <div class="level-title">Intermediate Level</div>
    <div class="module-row" id="intermediateRow"></div>

    <!-- Advanced -->
    <div class="level-title">Advanced Level</div>
    <div class="module-row" id="advancedRow"></div>

    <!-- Progress -->
    <div class="progress-box">
      <div class="progress-label">Overall Progress</div>
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <button class="back-btn" onclick="window.location.href='index.html'">← Back to Home</button>

  </div>

  <script>
    /* MODULE DATA */
    const MODULES = {
      beginner: ["S-B-1", "S-B-2", "S-B-3", "S-B-4", "S-B-5"],
      intermediate: ["S-I-1", "S-I-2", "S-I-3", "S-I-4", "S-I-5"],
      advanced: ["S-A-1", "S-A-2", "S-A-3", "S-A-4", "S-A-5"]
    };

    const TOTAL = 15;

    /* Completed */
    let completed = JSON.parse(localStorage.getItem("speakingCompleted") || "{}");

    /* Unlock Flags */
    const intermediateUnlocked =
      localStorage.getItem("speaking-level-intermediate") === "unlocked";

    const advancedUnlocked =
      localStorage.getItem("speaking-level-advanced") === "unlocked";

    /* LOCK LOGIC */
    function isLocked(level) {
      if (level === "beginner") return false;
      if (level === "intermediate") return !intermediateUnlocked;
      if (level === "advanced") return !advancedUnlocked;
      return true;
    }

    /* CREATE CARD */
    function createCard(level, id, index, rowId) {
      const locked = isLocked(level);

      const card = document.createElement("div");
      card.className = "module-card" + (locked ? " locked" : "");

      card.onclick = () => {
        if (!locked) window.location.href = `speaking.html?id=${id}`;
      };

      card.innerHTML = `
        Module ${index + 1}
        ${locked
          ? `<div class='lock-icon'>🔒</div>`
          : completed[id]
            ? `<div class='check-icon'>✔</div>`
            : ""
        }
      `;

      document.getElementById(rowId).appendChild(card);
    }

    /* LOAD UI MODULES */
    function loadModules() {
      MODULES.beginner.forEach((id, i) =>
        createCard("beginner", id, i, "beginnerRow")
      );

      MODULES.intermediate.forEach((id, i) =>
        createCard("intermediate", id, i, "intermediateRow")
      );

      MODULES.advanced.forEach((id, i) =>
        createCard("advanced", id, i, "advancedRow")
      );
    }

    /* PROGRESS BAR */
    function updateProgress() {
      const done = Object.keys(completed).length;
      const percent = Math.round((done / TOTAL) * 100);
      document.getElementById("progressFill").style.width = percent + "%";
    }

    loadModules();
    updateProgress();
  </script>

  <script src="theme.js"></script>
</body>

</html>
